<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
</head>
<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="style.css">
    <script type="text/babel">
        const {useState, useEffect}=React
        
        
        
        
        
        function App(){
            const [students,setStudents]=useState([]);
            const[isLoading,setIsLoading]=useState(true);
            const[error,setError]=useState(false);
            const[searchText,setSearchText]=useState(localStorage.getItem('searchText')||'');
            const[selectedCity,setSelectedCity]=useState(localStorage.getItem('selectedCity')||'All Cities');
            const[isOnline,setIsOnline]=useState(navigator.onLine);
            useEffect(()=>{
                localStorage.setItem('searchText',searchText);
            },[searchText]);
            useEffect(()=>{
                localStorage.setItem('selectedCity',selectedCity);
            },[selectedCity]);
            useEffect(() => {
             lucide.createIcons();
            })
            useEffect(()=>{
                fetch('https://dummyjson.com/users')
                .then((response)=>{
                    return response.json();
                })
                .then((data)=>{
                    console.log(data)
                    setStudents(data.users);
                    setTimeout(()=>{
                        setIsLoading(false);
                    },1500);
                    
                })
                .catch(()=>{
                    if(navigator.onLine){
                        setError(true);
                    }
                    
                    setIsLoading(false);
                });
            }, [])
            useEffect(()=>{
                const handleOnline=()=>{
                    setIsOnline(true);
                    setError(false);
                    setIsLoading(false);
                     fetch('https://dummyjson.com/users')
                .then((response)=>{
                    return response.json();
                })
                .then((data)=>{
                    console.log(data)
                    setStudents(data.users);
                    setTimeout(()=>{
                        setIsLoading(false);
                    },1500);
                    
                })
                .catch(()=>{
                    
                 setError(true);
                 setIsLoading(false);
                });
            
                };
                const handleOffline =()=>{
                    setIsOnline(false);
                };
                window.addEventListener('online',handleOnline);
                window.addEventListener('offline',handleOffline);

                return()=>{
                    window.removeEventListener('online',handleOnline);
                    window.removeEventListener('offline',handleOffline)
                };

            },[])
            const filteredStudents=students.filter((student)=>{
                const matchesUsername=student.username
                        .toLowerCase()
                        .includes(searchText.toLowerCase());
                const matchesCity=selectedCity ==='All Cities'||
                        student.address.city === selectedCity;
                        return matchesUsername && matchesCity
                    
            });
            const cities=[...new Set (students.map((student)=>{
                return student.address.city;
            })
        )];
            return(
                <>
                <Header />
                <div className="page">
                <Body1
                searchText={searchText}
                setSearchText={setSearchText}
                cities={cities}
                selectedCity={selectedCity}
                setSelectedCity={setSelectedCity}
                isOnline={isOnline}
                error={error}
                 />
                {isLoading &&
                    <div className="loading-page">
                         <i data-lucide="loader-circle"></i>
                         <h3 class="loading-state">Loading Students...</h3>
                         <p>This might take a few seconds</p>
                    </div>
                }
                {!isOnline && (
                    <div className="internet-loss-page">
                    <i data-lucide="wifi-off"></i> 
                    <p>Connection Lost. <br />
                    Please check your Internet Connection and Try Again.</p>
                    </div>
                )}
                    
                {error && 
                <div className="error-page">
                    <i data-lucide="circle-x"></i> 
                    <h3>Unable to Load Students.</h3>
                    <p>Something went wrong while fetching the<br />student directory.</p>
                </div>
            }
                {isOnline &&!isLoading && !error && filteredStudents.length===0 &&(
                    <div className="user-not-found">
                        
                        <i data-lucide="search"></i> 
                        <p>Student Not Found...</p>
                        <p>We couldn't find any student named "{searchText}"</p>


                    </div>
                )}
                {isOnline &&!isLoading && !error && filteredStudents.length >0 &&(
                    <div className="students-container">
                        {filteredStudents.map((student)=>(
                            <StudentsCard
                            key={student.id}
                            name={student.firstName+ ' ' +student.lastName}
                            image={student.image}
                            username={student.username}
                            email={student.email}
                            city={student.address.city}
                            />
                        ))}
                    </div>
                )}
                </div>
                
                </>
            );
        }
        const container=document.querySelector('.js-container')
        ReactDOM.createRoot(container).render(<App />)
        
    </script>
</body>
</html>
